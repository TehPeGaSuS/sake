{{define "body"}}
<div class="brand">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9.5 2.5h3.2l.6 3.2H8.9z"/>
    <path d="M8.5 5.7h5.4l1.1 8.6c.15 1.2-.8 2.2-2 2.2h-3.6c-1.2 0-2.15-1-2-2.2z"/>
    <path d="M6 20.2c0-1.5 1.4-2.7 3.2-2.7h1.1"/>
    <ellipse cx="6" cy="20.2" rx="3.2" ry="1.3"/>
  </svg>
  <span>Sake Admin Panel</span>
</div>
<h1>Log in</h1>
<form method="post" action="/admin/login">
  <label>Username</label>
  <input type="text" name="username" autofocus required>
  <label>Password</label>
  <input type="password" name="password" required>
  <div class="actions"><button type="submit">Log in</button></div>
</form>
{{end}}
{{template "layout" .}}
