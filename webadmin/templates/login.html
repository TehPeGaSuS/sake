{{define "body"}}
<div class="login">
  <div class="login-side">
    {{template "logo" 64}}
    <p class="wordmark">sake</p>
    <p>Your IRC bouncer. Manage your networks, channels and connected clients.</p>
  </div>
  <div class="login-form">
    <form method="post" action="/admin/login">
      <h1>Log in</h1>
      {{template "flash" .}}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Log in</button>
    </form>
  </div>
</div>
{{end}}
{{template "layout" .}}
